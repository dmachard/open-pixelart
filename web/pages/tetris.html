<!-- PAGE: TETRIS MODE -->
<div id="gamePage" class="page game-page">
    <div class="game-header">
        <h1>Tetris</h1>
    </div>

    <!-- Top Controls: Back & Restart -->
    <div class="top-controls">
        <div class="control-btn" id="backFromGame">
            <span class="icon">←</span>
            <span>Back</span>
        </div>
        <div class="control-btn" id="startTetrisBtn">
            <span class="icon">▶️</span>
            <span id="tetrisStatusText">Start</span>
        </div>
    </div>

    <!-- Score Display (Now Compact) -->
    <div class="score-container">
        <div class="score-display">
            <span class="score-label">SCORE</span>
            <span id="tetrisScore" class="score-value">0</span>
        </div>
    </div>

    <!-- Swipe Zone -->
    <div id="tetrisSwipeArea" class="swipe-area"></div>

    <!-- Bottom Controls: D-Pad -->
    <div class="game-controls">
        <div class="dpad-row">
            <button id="btnRotate" class="game-btn action-btn">↻</button>
        </div>
        <div class="dpad-row">
            <button id="btnLeft" class="game-btn">←</button>
            <button id="btnDown" class="game-btn">↓</button>
            <button id="btnRight" class="game-btn">→</button>
        </div>
    </div>
</div>
