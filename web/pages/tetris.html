<!-- PAGE: TETRIS MODE -->
<div id="gamePage" class="page game-page">
    <div class="game-header">
        <h1>Tetris</h1>
    </div>

    <!-- Top Controls: Back & Restart -->
    <div class="top-controls">
        <div class="control-btn" id="backFromGame">
            <span class="icon">←</span>
            <span>Back</span>
        </div>
        <div class="control-btn" id="startTetrisBtn">
            <span class="icon">▶️</span>
            <span id="tetrisStatusText">Start</span>
        </div>
    </div>

    <!-- Score Display (Central) -->
    <div class="score-container"
        style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;">
        <div class="score-display" style="flex-direction: column;">
            <span class="score-label">SCORE</span>
            <span id="tetrisScore" class="score-value">0</span>
        </div>
    </div>

    <!-- Bottom Controls: D-Pad -->
    <div class="game-controls">
        <div class="dpad-row">
            <button id="btnRotate" class="game-btn action-btn">↻</button>
        </div>
        <div class="dpad-row">
            <button id="btnLeft" class="game-btn">←</button>
            <button id="btnDown" class="game-btn">↓</button>
            <button id="btnRight" class="game-btn">→</button>
        </div>
    </div>
</div>
